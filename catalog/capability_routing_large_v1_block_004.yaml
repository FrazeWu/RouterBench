    dependencies: [locate_stalled_scheduler, inspect_checkpoint, correlate_pending_jobs, validate_change_window, stage_pause_resume, verify_queue_integrity, confirm_recovery]
    capability_sequence: [source, runtime, automation, governance, configuration, data, human]
    capability_sets:
      source: {pool: source_evidence, resource: source_artifacts.migration_tool.product_api.staging.ap_southeast, mode: compare, strategy: source_read}
      runtime: {pool: runtime_evidence, resource: cloud_runtime.cron_function.product_api.staging.ap_southeast, mode: inspect, strategy: runtime_read}
      automation: {pool: agent_and_automation, resource: agent_runtime.checkpoint_state.product_api.staging.ap_southeast, mode: audit, strategy: automation_state}
      governance: {pool: governance_and_audit, resource: governance.change_window.product_api.staging.ap_southeast, mode: validate, strategy: governance_read}
      configuration: {pool: configuration_change, resource: configuration.rollout_gate.product_api.staging.ap_southeast, mode: scoped_update, strategy: configuration_change}
      data: {pool: data_and_storage, resource: data_stores.migration_queue.product_api.staging.ap_southeast, mode: query, strategy: data_scope}
