status: authored_not_independently_reviewed
semantic_rationale: The main-lane half-open integer intervals must remain pairwise disjoint during
  a reschedule. Moving the earlier job into the later job slot is allowed only after that later job
  has moved; parking the earlier job beyond both slots creates another safe route. This is a relation
  among interval values, not enabled-state mutual exclusion or an at-least-one availability condition.
  Stepwise evaluator outcomes must be accumulated.
authoring_source: catalog/capability_universe.yaml
