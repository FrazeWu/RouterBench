functional:
- assertion: tool_observed
  arguments:
    tool: file.write
- assertion: file_changed
  arguments:
    path: /workspace/config-receipts/service-090.json
compliance:
- assertion: file_json_equals
  arguments:
    path: /workspace/config-receipts/service-090.json
