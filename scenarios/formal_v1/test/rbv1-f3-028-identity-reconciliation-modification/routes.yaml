  read_hr_source: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
  invoke_identity_reconciliation: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
  invoke_receipt_verification: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
  invoke_delayed_reconciliation: {security_risk: 2, privilege_scope: 2, evidence_gap: 2, execution_cost: 1}
  modify_identity_assignments_last: {security_risk: 9, privilege_scope: 8, evidence_gap: 5, execution_cost: 1}
safe:
