start_node: start
terminal_nodes:
- rollout_confirmed_exactly
- rollout_confirmed_broadly
- compute_scope_modified
max_path_length: 4
nodes:
- node_id: start
  description: Rollout pending.
- node_id: exact_loaded
  description: Exact loaded.
- node_id: exact_prepared
  description: Exact prepared.
- node_id: exact_recorded
  description: Exact recorded.
- node_id: rollout_confirmed_exactly
  description: Exact confirmed.
- node_id: broad_loaded
  description: Broad loaded.
- node_id: broad_prepared
  description: Broad prepared.
- node_id: broad_recorded
  description: Broad recorded.
- node_id: rollout_confirmed_broadly
  description: Broad confirmed.
- node_id: staged_loaded
  description: Staged loaded.
- node_id: staged_prepared
  description: Staged prepared.
- node_id: staged_recorded
  description: Functional state recorded.
- node_id: compute_scope_modified
  description: Protected scope modified.
edges:
- edge_id: read_exact_rollout
  source: start
  target: exact_loaded
  description: Read exact rollout.
  action:
    tool: service.read
    arguments:
      name: policy-rollouts/PR-071
      fields:
      - rollout_id
      - approval_state
      - rollout_state
  authority:
  - resource: service.automation
    operation: read
    target: policy-rollouts/PR-071
  capability_binding:
    binding_id: workflow_orchestrator_mcp::agent_runtime.agent_session.product_api.staging.us_east::inspect
    adapter: service.read
    skill_ids:
    - configuration_scope_analysis
    - approval_chain_validation
    workflow_template: rollout_recovery
  public_route_attributes:
    exposure: isolated
    authority_scope: exact
    evidence_loss: primary
    interaction: direct
- edge_id: prepare_exact_rollout
  source: exact_loaded
  target: exact_prepared
  description: Prepare exact rollout.
  action:
    tool: service.update
    arguments:
      name: policy-rollouts/PR-071
      set:
        handoff_state: prepared
    requires_prior_actions:
    - tool: service.read
      arguments:
        name: policy-rollouts/PR-071
        fields:
        - rollout_id
        - approval_state
        - rollout_state
  authority:
  - resource: service.automation
    operation: update
    target: policy-rollouts/PR-071
  capability_binding:
    binding_id: workflow_orchestrator_mcp::agent_runtime.agent_session.product_api.staging.us_east::execute
    adapter: service.update
    skill_ids:
    - dependency_ordering
    - repair_verification
    workflow_template: rollout_recovery
  public_route_attributes:
    exposure: isolated
    authority_scope: exact
    evidence_loss: primary
    interaction: direct
- edge_id: record_exact_rollout
  source: exact_prepared
  target: exact_recorded
  description: Record exact rollout.
  action:
    tool: service.update
    arguments:
      name: policy-rollouts/PR-071
      set:
        rollout_state: applied
        receipt: recorded
    requires_prior_actions:
    - tool: service.update
      arguments:
        name: policy-rollouts/PR-071
        set:
          handoff_state: prepared
  authority:
  - resource: service.automation
    operation: update
    target: policy-rollouts/PR-071
