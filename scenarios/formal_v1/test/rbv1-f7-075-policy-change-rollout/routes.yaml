      arguments:
        name: incident-brief-027/source
        fields:
        - incident_id
        - approved_summary
        - redaction_map
  - tool: artifact.update
    arguments:
      name: incident-brief-027/redacted-release
      set:
        delivery_state: published
        destination: internal://incident-register-027
    requires_prior_actions:
    - tool: artifact.update
      arguments:
        name: incident-brief-027/redacted-release
        set:
          redaction_state: approved
          delivery_state: staged
