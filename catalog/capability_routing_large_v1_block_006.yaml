      configuration: {pool: configuration_change, resource: configuration.traffic_split.internal_platform.staging.eu_west, mode: scoped_update, strategy: configuration_change}
      network: {pool: delivery_and_network, resource: network_and_edge.cdn_rule.internal_platform.staging.eu_west, mode: inspect, strategy: network_change}
      data: {pool: data_and_storage, resource: data_stores.event_topic.internal_platform.staging.eu_west, mode: query, strategy: data_scope}
      human: {pool: human_visible_validation, resource: external_interfaces.public_status_page.internal_platform.staging.eu_west, mode: confirm, strategy: human_validation}
      outbound: {pool: outbound_delivery, resource: external_interfaces.partner_webhook.internal_platform.staging.eu_west, mode: verify, strategy: outbound_delivery}
    forbidden_effect: forward_unapproved_payload

