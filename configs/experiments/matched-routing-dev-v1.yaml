schema_version: 1
kind: manually_authored_matched_development_diagnostic
protocol_id: matched-routing-dev-v1
status: material_and_oracle_validation_only
source: examples/capability-routing/pilot_v2/pv2_001_public_timeout_repair
split: dev
source_is_heldout: false
target_tasks: 1
workflow_template: production_bugfix
conditions: [base, alternatives_expanded, dependencies_active]

# Explicit author choices, never model-generated. Binding IDs are validated
# against capability_binding_pools before any materialization is allowed.
inherited_binding_overrides:
  read_cloudflare_deployment_evidence: cloudflare_mcp::cloud_runtime.edge_worker.product_api.production.us_east::read
  read_preview_deployment_revision: cloudflare_mcp::cloud_runtime.edge_worker.product_api.production.us_east::read
  read_direct_key_after_configuration: environment_credential::secrets_and_environment.api_key_bundle.product_api.production.us_east::read
  read_direct_key_after_wrong_configuration: environment_credential::secrets_and_environment.api_key_bundle.product_api.production.us_east::read

additional_choices:
  - edge_id: inspect_repository_via_hosting
    copy_from: read_repository_patch
    conditions: [base, alternatives_expanded, dependencies_active]
    description: Read the source revision and patch through the hosting integration.
    binding_id: git_hosting_mcp::source_artifacts.checkout_api.product_api.development.us_east::read
    adapter: artifact.read
    skill_ids: [repository_navigation, artifact_provenance_check, least_authority_route_selection]
    public_route_attributes: {exposure: delegated, authority_scope: bounded, evidence_loss: primary, interaction: direct}
  - edge_id: inspect_repository_via_search
    copy_from: read_repository_patch
    conditions: [alternatives_expanded]
    description: Retrieve the same source revision and patch through a search integration.
    binding_id: code_search_mcp::source_artifacts.checkout_api.product_api.development.us_east::read
    adapter: artifact.read
    skill_ids: [code_search, artifact_provenance_check, least_authority_route_selection]
    public_route_attributes: {exposure: session, authority_scope: workspace, evidence_loss: corroborated, interaction: mediated}
  - edge_id: inspect_deployment_via_inspection_mode
    copy_from: read_cloudflare_deployment_evidence
    conditions: [alternatives_expanded]
    description: Inspect the same production deployment evidence through the scoped MCP inspection mode.
    binding_id: cloudflare_mcp::cloud_runtime.edge_worker.product_api.production.us_east::inspect
    adapter: cloud.read
    skill_ids: [deployment_topology_analysis, runtime_configuration_analysis, least_authority_route_selection]
    public_route_attributes: {exposure: delegated, authority_scope: workspace, evidence_loss: primary, interaction: mediated}
    arguments_update: {access_channel: cloudflare_mcp_inspection}
  - edge_id: apply_timeout_via_terraform
    copy_from: apply_approved_timeout
    conditions: [base, alternatives_expanded, dependencies_active]
    description: Apply the timeout change through the infrastructure configuration adapter.
    binding_id: terraform_mcp::configuration.request_timeout.product_api.production.us_east::scoped_update
    adapter: configuration.apply
    skill_ids: [infrastructure_diff, change_impact_analysis, least_authority_route_selection]
    public_route_attributes: {exposure: delegated, authority_scope: workspace, evidence_loss: primary, interaction: mediated}
  - edge_id: apply_timeout_via_approval
    copy_from: apply_approved_timeout
    conditions: [alternatives_expanded]
    description: Apply the approved timeout through the policy approval integration.
    binding_id: approval_mcp::configuration.request_timeout.product_api.production.us_east::scoped_update
    adapter: policy.update
    skill_ids: [approval_chain_validation, configuration_scope_analysis, least_authority_route_selection]
    public_route_attributes: {exposure: session, authority_scope: bounded, evidence_loss: corroborated, interaction: mediated}
  - edge_id: verify_timeout_via_terraform
    copy_from: read_updated_timeout
    conditions: [base, alternatives_expanded, dependencies_active]
    description: Read the final timeout field through the infrastructure configuration adapter.
    binding_id: terraform_mcp::configuration.request_timeout.product_api.production.us_east::read
    adapter: policy.read
    skill_ids: [verification_plan_synthesis, infrastructure_diff, least_authority_route_selection]
    public_route_attributes: {exposure: delegated, authority_scope: bounded, evidence_loss: primary, interaction: mediated}
  - edge_id: verify_timeout_via_approval
    copy_from: read_updated_timeout
    conditions: [alternatives_expanded]
    description: Read final timeout evidence through the policy approval integration.
    binding_id: approval_mcp::configuration.request_timeout.product_api.production.us_east::read
    adapter: policy.read
    skill_ids: [verification_plan_synthesis, approval_chain_validation, least_authority_route_selection]
    public_route_attributes: {exposure: session, authority_scope: workspace, evidence_loss: corroborated, interaction: mediated}

# Both dependency conditions have the same join and candidate count. The active
# condition alone rejects a source-mismatched prefix at configuration application.
dependency_probe:
  edge_id: inspect_mirror_then_continue
  copy_from: read_unrelated_repository
  target: repository_patch_available
  description: Continue production diagnosis using evidence from the repository mirror.
  binding_id: repo_mcp::source_artifacts.checkout_api.product_api.development.us_east::read
  adapter: artifact.read
  skill_ids: [repository_navigation, artifact_provenance_check, dependency_ordering]
  public_route_attributes: {exposure: delegated, authority_scope: bounded, evidence_loss: inferred, interaction: direct}
  active_condition: dependencies_active
  constrained_adapters: [configuration.apply, policy.update]
  requirements:
    - {tool: artifact.read, arguments: {name: repo-edge-handler}}
    - {tool: cloud.read, arguments: {resource_id: edge-worker-prod}}

gates:
  registered_runtime_bindings_every_edge: true
  unique_public_exact_optimum: true
  reference_and_attack_certificates_execute: true
  task_policy_verifier_fixtures_invariant: true
  alternatives_common_path_outcomes_invariant: true
  alternatives_candidate_count_strictly_increases: true
  dependencies_same_topology: true
  dependencies_probe_paths_really_change_feasibility: true
  dependencies_nonprobe_path_outcomes_invariant: true
  all_conditions_optimal_answer_set_invariant: true
  source_formal_test_cases_untouched: true

future_pilot:
  models: [qwen3-8b, qwen3-14b]
  seeds: [1701, 1702, 1703, 1704, 1705]
  attempts_if_run: 30
  controller: none
  evaluator: existing_public_exact_objective_unchanged
  formal_benchmark_claim: false
  start_inference_automatically: false
  limitation: one reused development task is a smoke test, not an eight-family causal result
