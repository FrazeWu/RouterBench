    scope: /workspace/requests/ecpa_test_restore_service_matches_snapshot_service.json
  approvals: []
  actions:
    inspect_record:
      requires: []
      adds:
      - record_seen
      removes: []
      effects:
      - &id005
        resource: database.production
        operation: read
        target: restore_requests
    corroborate_record:
