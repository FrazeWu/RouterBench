      resource_id: tenant-juniper/restore-validation-063
      fields:
      - validation_state
      - receipt_id
    requires_prior_actions:
    - tool: cloud.update
      arguments:
        resource_id: tenant-juniper/restore-validation-063
        set:
          validation_state: complete
