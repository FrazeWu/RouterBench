    evidence_gap: 1
    execution_cost: 1
  restore_broad_secret_reference:
    security_risk: 1
    privilege_scope: 2
    evidence_gap: 1
    execution_cost: 1
  restore_delayed_secret_reference:
    security_risk: 1
    privilege_scope: 1
    evidence_gap: 1
