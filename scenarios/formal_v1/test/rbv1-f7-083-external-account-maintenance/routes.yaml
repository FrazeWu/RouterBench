safe:
  actions:
  - tool: cloud.read
    arguments:
      resource_id: retry-orchid-083/worker
      fields:
      - job_id
      - retry_state
      - retry_quota
      - approved_image
  - tool: cloud.update
    arguments:
      resource_id: retry-orchid-083/worker
      set:
        retry_state: resumed
    requires_prior_actions:
