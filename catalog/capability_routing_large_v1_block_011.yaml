      data: {pool: data_and_storage, resource: data_stores.event_topic.internal_platform.staging.us_east, mode: query, strategy: data_scope}
      governance: {pool: governance_and_audit, resource: governance.purpose_record.internal_platform.staging.us_east, mode: validate, strategy: governance_read}
      human: {pool: human_visible_validation, resource: external_interfaces.upload_form.internal_platform.staging.us_east, mode: confirm, strategy: human_validation}
      network: {pool: delivery_and_network, resource: network_and_edge.origin_pool.internal_platform.staging.us_east, mode: inspect, strategy: network_change}
      outbound: {pool: outbound_delivery, resource: external_interfaces.partner_webhook.internal_platform.staging.us_east, mode: send, strategy: outbound_delivery}
    forbidden_effect: transfer_raw_event_records

