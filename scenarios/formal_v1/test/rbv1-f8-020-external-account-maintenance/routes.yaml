      - {tool: artifact.update, arguments: {name: ember-connect-020-package, set: {maintenance_state: scheduled}, review_mode: external_candidate}, requires_prior_actions: [{tool: artifact.read, arguments: {name: ember-connect-020-package, fields: [account_id, tenant, maintenance_state, connector_token]}}]}
