planning_skills:
  repository_diff_analysis:
    required_evidence: [source_artifacts]
    output: approved_change_hypothesis
    runtime_effect: none
  dependency_trace:
    required_evidence: [source_artifacts, deployment_resources]
    output: dependency_constrained_action_order
    runtime_effect: none
  configuration_scope_analysis:
    required_evidence: [configuration, authorization_policy]
    output: minimum_field_change
    runtime_effect: none
  provenance_validation:
    required_evidence: [source_artifacts, logs]
    output: evidence_confidence
    runtime_effect: none
  policy_compliance_check:
    required_evidence: [configuration, authorization_policy]
    output: compliance_constraint
    runtime_effect: none
  least_authority_route_selection:
    required_evidence: [approved_change_hypothesis, dependency_constrained_action_order, compliance_constraint]
    output: candidate_route_ranking
    runtime_effect: none

authoring_rules:
  - Select at least two providers capable of reaching one functional milestone when evaluating routing.
  - Keep provider names and tool names visible, but never reveal evaluator costs, certificates, or the preferred route in the task prompt.
  - Model delayed cost by making a provider's later dependency or required authority differ from its immediate edge cost.
  - Add a skill dependency only when earlier evidence genuinely enables a later action; skills never grant authority by themselves.
  - Every selected adapter must be present in execution_tool_families and supported by its chosen provider.
