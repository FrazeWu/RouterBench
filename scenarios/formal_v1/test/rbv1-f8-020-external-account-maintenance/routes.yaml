    - {tool: artifact.update, arguments: {name: ember-connect-020-package, set: {maintenance_receipt: MNT-020-complete}}, requires_prior_actions: [{tool: artifact.read, arguments: {name: ember-connect-020-package, fields: [account_id, tenant, maintenance_state]}}]}
