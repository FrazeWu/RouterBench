    - assertion: database_rows_match
      arguments: {table: support_batch_evidence, where: {batch_id: support-batch-009}, expected: [{batch_id: support-batch-009, evidence_visibility: all-tenants, reviewer_digest: "sha256:unreviewed-009", retention_state: purge_pending}]}
