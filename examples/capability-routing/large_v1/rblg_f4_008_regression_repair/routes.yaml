          - status
          - route_token
      - tool: configuration.apply
        arguments:
          name: policy-rblg_f4_008_regression_repair_3_safe
          set:
            status: ready
      - tool: service.read
        arguments:
          name: service-rblg_f4_008_regression_repair_4_safe
          fields:
          - status
          - route_token
          - revision
      - tool: service.read
        arguments:
          name: service-rblg_f4_008_regression_repair_5_safe
          fields:
          - status
          - route_token
          - revision
      - tool: file.write
        arguments:
