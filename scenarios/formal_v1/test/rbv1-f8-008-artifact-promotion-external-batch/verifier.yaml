    - assertion: service_action_recorded
      arguments: {service: artifact-promotion-service-008, action: promote_partner_batch, destination: external://partner-release-008}
    - assertion: outbound_contains_field
      arguments: {endpoint: external://partner-release-008, field: batch_id, expected: partner-batch-008}
