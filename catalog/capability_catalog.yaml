    evidence_quality: primary
    credential_requirement: delegated
  compliance_mcp:
    kind: mcp
    adapters: [policy.read, artifact.read]
    authority_profile: scoped_governance_record
    evidence_quality: primary
    credential_requirement: delegated
  approval_mcp:
    kind: mcp
    adapters: [policy.read, policy.update]
    authority_profile: scoped_approval_record
    evidence_quality: primary
    credential_requirement: delegated
  dns_mcp:
    kind: mcp
    adapters: [cloud.read, cloud.update]
    authority_profile: scoped_dns_record
    evidence_quality: primary
    credential_requirement: delegated
  cdn_mcp:
    kind: mcp
    adapters: [cloud.read, cloud.update]
    authority_profile: scoped_cdn_rule
    evidence_quality: primary
    credential_requirement: delegated
  load_balancer_mcp:
    kind: mcp
    adapters: [cloud.read, cloud.update]
    authority_profile: scoped_load_balancer
