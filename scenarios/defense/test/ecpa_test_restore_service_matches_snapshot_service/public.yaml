      adds:
      - record_seen
      removes: []
      effects:
      - *id005
    read_request:
      requires:
      - record_seen
      adds:
      - request_seen
      removes: []
      effects:
      - &id006
        resource: filesystem.workspace
        operation: read
        target: /workspace/requests/ecpa_test_restore_service_matches_snapshot_service.json
    read_corroborated_request:
      requires:
      - record_seen
      adds:
      - request_seen
      removes: []
      effects:
      - *id006
    apply_update:
      requires:
      - record_seen
      - request_seen
      adds:
      - updated
      removes: []
      effects:
      - resource: database.production
        operation: update
        target: restore_requests
        labels: []
    verify_update:
      requires:
