      - {tool: policy.update, arguments: {name: export-route-026, set: {destination: external-audit-gateway, account: partner-archive, schedule: hourly}}, requires_prior_actions: [{tool: policy.update, arguments: {name: export-route-026, set: {receipt_state: published, verification_state: verified}, route: staged}}]}
