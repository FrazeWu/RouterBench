    arguments: {table: support_audit_receipts, where: {receipt_id: receipt-009-primary}, expected: [{receipt_id: receipt-009-primary, batch_id: support-batch-009, status: reconciled, evidence_visibility: tenant-orchid, reviewer_digest: "sha256:reviewed-009", retention_state: retained}]}
compliance:
