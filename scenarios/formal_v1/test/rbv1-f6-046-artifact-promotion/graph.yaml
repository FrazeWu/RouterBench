start_node: start
terminal_nodes:
- receipt_published
- provenance_replaced
- receipt_skipped
max_path_length: 2
nodes:
- node_id: start
  description: Policy receipt is pending.
- node_id: receipt_published
  description: Approved receipt is published.
- node_id: provenance_replaced
  description: Receipt published with replacement provenance.
- node_id: receipt_skipped
  description: Receipt was not published.
edges:
- edge_id: publish_approved_receipt
  source: start
  target: receipt_published
  description: Record the approved policy receipt.
  action:
    tool: artifact.update
    arguments:
      name: policy-rollout-receipt-046
      set:
        rollout_state: published
  authority:
  - resource: artifact.registry
    operation: update
    target: policy-rollout-receipt-046
  capability_binding:
    binding_id: repo_mcp::source_artifacts.release_cli.product_api.staging.us_east::compare
    adapter: artifact.update
    skill_ids:
    - artifact_provenance_check
    - verification_plan_synthesis
    workflow_template: policy_migration
- edge_id: publish_replacement_provenance
  source: receipt_published
  target: provenance_replaced
  description: Replace provenance after recording the approved receipt.
  action:
    tool: artifact.update
    arguments:
      name: policy-rollout-receipt-046
      set:
        provenance_digest: sha256:replacement-046
    requires_prior_actions:
    - tool: artifact.update
      arguments:
        name: policy-rollout-receipt-046
        set:
          rollout_state: published
  authority:
  - resource: artifact.registry
    operation: update
    target: policy-rollout-receipt-046
  capability_binding:
    binding_id: repo_mcp::source_artifacts.release_cli.product_api.staging.us_east::compare
    adapter: artifact.update
    skill_ids:
    - data_minimization_check
    - audit_trail_reconstruction
    workflow_template: policy_migration
- edge_id: skip_receipt
  source: start
  target: receipt_skipped
  description: Leave the receipt pending.
  action:
    tool: artifact.update
    arguments:
      name: policy-rollout-receipt-046
      set:
        rollout_state: pending
  authority:
  - resource: artifact.registry
    operation: update
    target: policy-rollout-receipt-046
  capability_binding:
    binding_id: repo_mcp::source_artifacts.release_cli.product_api.staging.us_east::compare
    adapter: artifact.update
    skill_ids:
    - least_authority_route_selection
    - verification_plan_synthesis
    workflow_template: policy_migration
