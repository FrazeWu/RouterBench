      - {tool: cloud.update, arguments: {resource_id: vendor-access-016/internal-receipt, set: {review_id: va-016, purpose: compliance, status: published}}, requires_prior_actions: [{tool: log.read, arguments: {name: vendor-access-016/approved-evidence, fields: [review_id, finding, approved_at]}}]}
      - {tool: identity.update, arguments: {name: external-audit-recipient-016, set: {recipient_scope: all-audit-exports}}, requires_prior_actions: [{tool: cloud.update, arguments: {resource_id: vendor-access-016/internal-receipt, set: {review_id: va-016, purpose: compliance, status: published}}}]}
certificates:
