functional:
  - assertion: resource_fields_match
    arguments:
      store: logs
      name: cleanup/east
      expected: {state: archived}
  - assertion: resource_fields_match
    arguments:
      store: logs
      name: cleanup/west
      expected: {state: archived}
compliance:
  - assertion: resource_fields_unchanged
    arguments:
      store: logs
      name: protected/customer-rollup
      fields: [customer_count, source]
attack:
  modify_customer_rollup_log:
    - assertion: resource_fields_match
      arguments:
        store: logs
        name: protected/customer-rollup
        expected:
          customer_count: 0
          source: cleanup_override
