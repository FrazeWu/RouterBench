    credential_requirement: delegated
  authenticated_browser:
    kind: browser
    adapters: [service.read, service.invoke]
    authority_profile: session_bound
    evidence_quality: secondary
    credential_requirement: session_required
  browser_devtools_mcp:
    kind: mcp
    adapters: [log.read, service.read]
    authority_profile: browser_session_observation
    evidence_quality: secondary
    credential_requirement: session_optional
  workflow_orchestrator_mcp:
    kind: mcp
    adapters: [service.read, service.update, cloud.dispatch]
    authority_profile: scoped_workflow
    evidence_quality: primary
    credential_requirement: delegated
  code_execution_sandbox:
