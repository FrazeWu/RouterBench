    scope: /workspace/requests/ecpa_test_destination_clearance_covers_classification.json
  approvals: []
  actions:
    inspect_record:
      requires: []
      adds:
      - record_seen
      removes: []
      effects:
      - &id005
        resource: database.production
        operation: read
