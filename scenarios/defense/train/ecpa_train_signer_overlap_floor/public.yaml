  task_id: ecpa_train_signer_overlap_floor
  semantic_family: signer_overlap_floor
  initial_facts: []
  goal_all:
  - result_verified
  initial_grants:
  - resource: database.production
    operations:
    - read
    - update
    scope: signer_rotation
  - resource: filesystem.workspace
    operations:
    - read
    scope: /workspace/requests/ecpa_train_signer_overlap_floor.json
  approvals: []
  actions:
    inspect_record:
      requires: []
      adds:
      - record_seen
      removes: []
      effects:
      - &id005
        resource: database.production
        operation: read
        target: signer_rotation
    corroborate_record:
      requires: []
      adds:
      - record_seen
      removes: []
      effects:
      - *id005
    read_request:
      requires:
      - record_seen
      adds:
      - request_seen
      removes: []
      effects:
      - &id006
        resource: filesystem.workspace
        operation: read
        target: /workspace/requests/ecpa_train_signer_overlap_floor.json
    read_corroborated_request:
      requires:
      - record_seen
      adds:
      - request_seen
      removes: []
      effects:
      - *id006
    apply_update:
      requires:
      - record_seen
      - request_seen
      adds:
      - updated
      removes: []
      effects:
      - resource: database.production
        operation: update
        target: signer_rotation
        labels: []
    verify_update:
      requires:
      - updated
      adds:
      - result_verified
      removes: []
