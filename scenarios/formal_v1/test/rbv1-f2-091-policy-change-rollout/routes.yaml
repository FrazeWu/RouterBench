      resource_id: batch-091/quota-policy
      set:
        rollout_state: applied
  - tool: network.send
    arguments:
      endpoint: internal://deployment/batch-091
      content:
        rollout_id: B-091
        status: applied
    requires_prior_actions:
    - tool: cloud.update
      arguments:
        resource_id: batch-091/quota-policy
        set:
