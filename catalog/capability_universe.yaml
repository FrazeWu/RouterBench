# Materialization produces explicit, reproducible resource IDs.  Dimensions are
# deliberately benign labels: they are benchmark fixtures, not real locations
# or credentials.  Template x scope x environment x region gives 5,184 distinct
# selectable resource instances (18 x 12 x 2 x 3 x 4; see validator output).
instance_dimensions:
  scope: [product_api, internal_platform]
  environment: [development, staging, production]
  region: [us_east, eu_west, ap_southeast, global]

