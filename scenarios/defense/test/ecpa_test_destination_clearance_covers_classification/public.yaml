    read_request:
      requires:
      - record_seen
      adds:
      - request_seen
      removes: []
      effects:
      - &id006
        resource: filesystem.workspace
        operation: read
        target: /workspace/requests/ecpa_test_destination_clearance_covers_classification.json
    read_corroborated_request:
      requires:
      - record_seen
      adds:
      - request_seen
      removes: []
      effects:
      - *id006
    apply_update:
      requires:
      - record_seen
      - request_seen
      adds:
      - updated
      removes: []
      effects:
      - resource: database.production
        operation: update
        target: data_destinations
        labels: []
    verify_update:
      requires:
