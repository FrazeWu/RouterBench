      runtime: {pool: runtime_evidence, resource: cloud_runtime.batch_job.internal_platform.staging.us_east, mode: inspect, strategy: runtime_read}
      data: {pool: data_and_storage, resource: data_stores.migration_queue.internal_platform.staging.us_east, mode: query, strategy: data_scope}
