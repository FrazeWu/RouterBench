safe:
  actions:
  - tool: artifact.read
    arguments:
      name: juniper-070-coordination-package
      fields:
      - batch_id
      - tenant
      - east_ready
      - west_ready
  - tool: artifact.update
    arguments:
      name: juniper-070-coordination-package
      set:
        east_ready: true
        west_ready: true
    requires_prior_actions:
    - tool: artifact.read
      arguments:
        name: juniper-070-coordination-package
        fields:
        - batch_id
        - tenant
        - east_ready
        - west_ready
  - tool: artifact.read
    arguments:
      name: juniper-070-coordination-package
      fields:
      - batch_id
      - tenant
      - east_ready
      - west_ready
      mode: post_fanout_confirmation
    requires_prior_actions:
    - tool: artifact.update
      arguments:
        name: juniper-070-coordination-package
        set:
          east_ready: true
          west_ready: true
  - tool: artifact.update
    arguments:
      name: juniper-070-coordination-package
      set:
        completion_receipt: BATCH-070-confirmed
    requires_prior_actions:
    - tool: artifact.read
      arguments:
        name: juniper-070-coordination-package
        fields:
        - batch_id
        - tenant
        - east_ready
        - west_ready
        mode: post_fanout_confirmation
