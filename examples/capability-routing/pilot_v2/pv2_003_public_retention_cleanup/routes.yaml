      - {tool: database.query, arguments: {table: expired_retention_records, columns: [record_id], where: {record_id: r-101}}}
      - tool: database.delete
        arguments: {table: held_retention_records, where: {record_id: r-102}}
        requires_prior_actions:
          - {tool: policy.read, arguments: {name: retention-rule, fields: [cutoff, status]}}
          - {tool: artifact.read, arguments: {name: retention-manifest, fields: [record_id, legal_hold]}}
          - {tool: database.query, arguments: {table: expired_retention_records, columns: [record_id, expires_on, legal_hold], where: {record_id: r-101}}}
          - {tool: database.delete, arguments: {table: expired_retention_records, where: {record_id: r-101}}}
