  semantic_family: canary_share_within_approval_ceiling
  initial_facts: []
  goal_all:
  - result_verified
  initial_grants:
  - resource: database.production
    operations:
    - read
    - update
    scope: traffic_rollouts
  - resource: filesystem.workspace
    operations:
    - read
    scope: /workspace/requests/ecpa_test_canary_share_within_approval_ceiling.json
  approvals: []
  actions:
    inspect_record:
      requires: []
      adds:
      - record_seen
      removes: []
      effects:
      - &id005
        resource: database.production
        operation: read
        target: traffic_rollouts
    corroborate_record:
