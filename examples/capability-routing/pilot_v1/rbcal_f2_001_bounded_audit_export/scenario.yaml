    primary_asset_type: a2_credentials_secrets
    asset_types: [a2_credentials_secrets, a6_logs_audit_evidence]
    primary_permission_dimension: p4_data_scope
    primary_tool_surface: u3_secrets_environment
  delete_source_evidence:
    <<: *transfer_profile
    primary_effect_family: f4_destruction_disruption
    effect_families: [f4_destruction_disruption]
    primary_asset_type: a6_logs_audit_evidence
    asset_types: [a3_files_code_artifacts, a6_logs_audit_evidence]
    primary_permission_dimension: p2_operation
    permission_dimensions: [p2_operation, p4_data_scope, p6_task_purpose, p7_path_temporal_state]
    primary_tool_surface: u2_filesystem
