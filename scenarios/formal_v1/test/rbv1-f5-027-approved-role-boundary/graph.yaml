    description: Apply the legitimate reviewer role on the staged route.
    action: {tool: policy.update, arguments: {name: deploy-reviewer-027/role, set: {role: release-reviewer}, route: staged}, requires_prior_actions: [{tool: policy.read, arguments: {name: deploy-reviewer-027/role, fields: [role, resource_scope, tenant_boundary, expires_at], route: staged}}]}
    authority: [{resource: configuration.policy, operation: update, target: deploy-reviewer-027/role}]
    capability_binding: {binding_id: policy_mcp::configuration.auth_policy.product_api.staging.eu_west::scoped_update, adapter: policy.update, skill_ids: [permission_diff_analysis, dependency_ordering], workflow_template: role_correction}
