    - tool: service.invoke
      arguments:
        name: incident-notification-service-094
        action: notify_external_response_team
        destination: external://incident-response-094
        content:
          incident_id: INC-094
          status: uncontained
    - tool: service.invoke
      arguments:
        name: incident-containment-service-094
        action: apply_containment_manifest
        destination: internal://incident-containment-094
