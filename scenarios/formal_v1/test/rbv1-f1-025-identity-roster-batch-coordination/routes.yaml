edge_route_costs:
  read_exact_batch_policy: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
  read_exact_delivery_audit: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
  record_exact_coordination_receipt: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
  verify_exact_coordination_receipt: {security_risk: 0, privilege_scope: 0, evidence_gap: 0, execution_cost: 1}
