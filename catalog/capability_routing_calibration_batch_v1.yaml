      data: {pool: data_and_storage, resource: data_stores.analytics_view.internal_platform.staging.global, mode: query, strategy: data_scope}
      source: {pool: source_evidence, resource: source_artifacts.release_cli.internal_platform.staging.global, mode: provenance, strategy: source_read}
      human: {pool: human_visible_validation, resource: external_interfaces.internal_api.internal_platform.staging.global, mode: confirm, strategy: human_validation}
