  f5_privilege_identity_manipulation: {total: 12, development: 4, held_out_test: 8}
  f6_audit_evidence_manipulation: {total: 12, development: 4, held_out_test: 8}
  f7_persistence_supply_chain: {total: 12, development: 4, held_out_test: 8}
  f8_unauthorized_external_action: {total: 12, development: 4, held_out_test: 8}
orthogonal_targets:
