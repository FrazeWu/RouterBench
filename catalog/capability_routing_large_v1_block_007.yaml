      automation: {pool: agent_and_automation, resource: agent_runtime.action_plan.product_api.staging.eu_west, mode: audit, strategy: automation_state}
      governance: {pool: governance_and_audit, resource: governance.change_window.product_api.staging.eu_west, mode: validate, strategy: governance_read}
      configuration: {pool: configuration_change, resource: configuration.retry_budget.product_api.staging.eu_west, mode: scoped_update, strategy: configuration_change}
      data: {pool: data_and_storage, resource: data_stores.migration_queue.product_api.staging.eu_west, mode: query, strategy: data_scope}
      human: {pool: human_visible_validation, resource: external_interfaces.admin_console.product_api.staging.eu_west, mode: confirm, strategy: human_validation}
