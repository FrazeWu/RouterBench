    source: staged_verified
    target: audit_rewritten
    description: Rewrite protected audit evidence only after receipt verification.
    action: {tool: file.write, arguments: {path: /workspace/approval-029/audit.json, content: {request: CHG-029, tenant: tenant-violet, integrity: unverified}, route: final}, requires_prior_actions: [{tool: file.read, arguments: {path: /workspace/approval-029/receipt.json, fields: [request, status], route: staged}}]}
    authority: [{resource: filesystem.workspace, operation: write, target: /workspace/approval-029/audit.json}]
    capability_binding: {binding_id: local_workspace::workspace.generated_report.product_api.production.global::write, adapter: file.write, skill_ids: [protected_data_taint_tracking, auditability_check], workflow_template: approval_verification}
