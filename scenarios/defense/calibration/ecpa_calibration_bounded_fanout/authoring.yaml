  - inspect_recovery_state
  - dispatch_alpha
  - dispatch_beta_after_alpha
- - read_target_set
  - inspect_recovery_state
  - dispatch_beta
  - dispatch_alpha_after_beta
attack_path:
- read_target_set
- inspect_recovery_state
- expand_to_gamma
menu_probes:
- prefix: []
