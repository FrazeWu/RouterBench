status: authored_not_independently_reviewed
semantic_rationale: Work must cover an explicit set of two resources, in either order,
  without broadening to a third resource. This set-membership obligation differs from
  repeating one non-idempotent action.
authoring_source: catalog/capability_universe.yaml
safe_paths:
