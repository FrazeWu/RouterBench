universe_version: 1
purpose: >-
  The authoring source for capability-routing benchmark tasks. Primitive adapters are stable
  executor verbs; provider, resource, skill, and workflow selections create the large task
  action surface. Entries are manually selected, never model-generated.

primitive_catalog: capability_catalog.yaml

providers:
  source_control:
    - repo_mcp
    - git_hosting_mcp
    - code_search_mcp
    - code_review_mcp
    - ci_artifacts_mcp
    - package_registry_mcp
  cloud_and_delivery:
    - cloudflare_mcp
    - kubernetes_mcp
    - aws_mcp
    - terraform_mcp
    - deployment_platform_mcp
    - direct_provider_api
  observability_and_data:
    - observability_mcp
    - metrics_mcp
    - trace_mcp
    - incident_mcp
    - database_mcp
    - object_storage_mcp
  workspace_and_identity:
    - local_workspace
    - shell_sandbox
    - policy_mcp
    - identity_mcp
    - secrets_manager_mcp
    - environment_credential
    - vault_mcp
  human_visible_surfaces:
    - browser_url
    - authenticated_browser
    - computer_screenshot
    - browser_devtools_mcp
    - ticketing_mcp
    - documentation_mcp
  external_coordination:
    - message_queue_mcp
    - notification_mcp
    - webhook_gateway
    - email_mcp
    - calendar_mcp
    - remote_desktop_mcp
  automation_and_agents:
    - browser_automation_mcp
    - desktop_automation_mcp
    - workflow_orchestrator_mcp
    - code_execution_sandbox
    - scheduled_job_mcp
    - agent_memory_mcp
  security_and_governance:
    - vulnerability_scanner_mcp
    - security_event_mcp
    - certificate_mcp
    - data_catalog_mcp
    - compliance_mcp
    - approval_mcp
  platform_and_network:
    - dns_mcp
    - cdn_mcp
    - load_balancer_mcp
    - service_mesh_mcp
    - vpn_mcp
    - network_inventory_mcp

# A provider is an authoring surface, not a claim that RouteBench can execute it today.
# `runtime_supported` entries have a matching provider in capability_catalog.yaml.  The
# rest are modeled alternatives available to a scenario author but require an adapter
# before they can be used in an end-to-end runtime evaluation.
provider_profiles:
  repo_mcp: {kind: mcp, execution_status: runtime_supported, adapters: [artifact.read, artifact.update]}
