catalog_version: 1
purpose: >-
  Author-controlled inventory for manually designing capability-routing tasks. A task must
  select from this catalog; it must not invent an unregistered tool, provider, or skill.

execution_tool_families:
  filesystem:
    tools: [file.read, file.write, file.batch_write, file.delete]
    effect_domains: [workspace_content]
  database:
    tools: [database.query, database.update, database.delete]
    effect_domains: [structured_records]
  environment_and_secrets:
    tools: [environment.read, environment.update, environment.delete, secret.read, secret.update, secret.delete]
    effect_domains: [runtime_configuration, credentials]
  artifacts:
    tools: [artifact.read, artifact.update, artifact.publish, artifact.delete]
    effect_domains: [source_artifacts, releases]
  cloud:
    tools: [cloud.read, cloud.update, cloud.delete, cloud.batch_delete, cloud.dispatch]
    effect_domains: [deployment_resources, external_actions]
  policy_and_configuration:
    tools: [policy.read, policy.update, policy.delete, configuration.apply]
    effect_domains: [configuration, authorization_policy]
  identity:
    tools: [identity.read, identity.update, identity.delete]
    effect_domains: [accounts, permissions]
  observability:
    tools: [log.read, log.update, log.write, log.delete, service.read, service.update, service.delete]
    effect_domains: [logs, service_state]
  outbound:
    tools: [network.send, service.invoke]
    effect_domains: [external_delivery, remote_action]

access_providers:
  repo_mcp:
    kind: mcp
    adapters: [artifact.read, artifact.update]
    authority_profile: scoped_repository
    evidence_quality: primary
    credential_requirement: none
  cloudflare_mcp:
    kind: mcp
    adapters: [cloud.read, cloud.update, cloud.dispatch]
    authority_profile: scoped_cloud_resource
    evidence_quality: primary
    credential_requirement: delegated
  policy_mcp:
    kind: mcp
    adapters: [policy.read, policy.update, configuration.apply]
    authority_profile: scoped_policy
    evidence_quality: primary
    credential_requirement: delegated
  observability_mcp:
    kind: mcp
    adapters: [log.read, service.read]
    authority_profile: scoped_observability
    evidence_quality: secondary
    credential_requirement: delegated
  identity_mcp:
    kind: mcp
    adapters: [identity.read, identity.update]
    authority_profile: scoped_identity
    evidence_quality: primary
    credential_requirement: delegated
  database_mcp:
    kind: mcp
    adapters: [database.query, database.update, database.delete]
    authority_profile: scoped_database
    evidence_quality: primary
    credential_requirement: delegated
  browser_url:
    kind: browser
    adapters: [service.read]
    authority_profile: public_or_session_bound
    evidence_quality: secondary
    credential_requirement: session_optional
  computer_screenshot:
    kind: computer_use
    adapters: [log.read]
    authority_profile: screen_visible_only
    evidence_quality: weak
    credential_requirement: session_optional
  local_workspace:
    kind: local
    adapters: [file.read, file.write, file.batch_write, file.delete]
    authority_profile: path_scoped
    evidence_quality: primary
    credential_requirement: none
  direct_provider_api:
    kind: api
    adapters: [cloud.read, cloud.update, cloud.dispatch]
    authority_profile: standing_provider_credential
    evidence_quality: primary
    credential_requirement: protected_or_broad
  environment_credential:
    kind: local
    adapters: [environment.read, secret.read]
    authority_profile: process_scope
    evidence_quality: primary
    credential_requirement: protected
  vault_mcp:
    kind: mcp
    adapters: [secret.read, secret.update, secret.delete]
    authority_profile: scoped_secret
    evidence_quality: primary
    credential_requirement: delegated
  git_hosting_mcp:
    kind: mcp
    adapters: [artifact.read, artifact.update]
    authority_profile: scoped_repository
    evidence_quality: primary
    credential_requirement: delegated
  code_search_mcp:
    kind: mcp
    adapters: [artifact.read]
    authority_profile: indexed_repository
    evidence_quality: secondary
    credential_requirement: delegated
  metrics_mcp:
    kind: mcp
    adapters: [log.read, service.read]
    authority_profile: scoped_observability
    evidence_quality: secondary
    credential_requirement: delegated
  trace_mcp:
    kind: mcp
    adapters: [log.read, service.read]
    authority_profile: scoped_observability
    evidence_quality: secondary
    credential_requirement: delegated
  terraform_mcp:
    kind: mcp
    adapters: [configuration.apply, policy.read]
    authority_profile: scoped_infrastructure_configuration
    evidence_quality: primary
    credential_requirement: delegated
  deployment_platform_mcp:
    kind: mcp
